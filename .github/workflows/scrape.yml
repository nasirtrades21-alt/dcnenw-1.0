name: DC Acquisition Engine

on:
  schedule:
    - cron: "0 7 * * *"   # 7:00 AM UTC, every day
  workflow_dispatch: {}     # lets you click "Run workflow" manually on GitHub

jobs:
  scrape:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        run: python scraper/fetch.py

      - name: Commit and push updated data
        run: |
          git config user.name "dc-acquisition-bot"
          git config user.email "actions@github.com"
          git add data/leads.csv data/dc_acquisition.db
          git diff --staged --quiet || git commit -m "Daily scraper run: $(date -u +%Y-%m-%d)"
          git push
